<p>dashboard works!</p>

@if (isLoading) {
  <div class="alert alert-info">
    Loading....
  </div>
}



@if ((vm$ | async); as vm) {
  <div class="row">
    <div class="col">
      <app-list [cvs]="vm.cvs"/>
    </div>
    <div class="col">
      <ol class="list-group">
        @for (todo of vm.todos; track todo) {
          <li
            class="list-group list-group-item">
            {{todo.todo}}
          </li>
        }
      </ol>
    </div>
  </div>
}
