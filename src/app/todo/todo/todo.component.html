<div class="row">
  <div class="col">
    <button (click)="todoRessource.reload()" class="btn btn-danger">
      Reload
    </button>
    @if (todoRessource.isLoading()) {
      <div class="alert alert-info">
        Loading...
      </div>
    } @else {
      <ol class="list-group">
        @for (todo of todoRessource.value(); track todo) {
          <li class="list-group-item">
            {{todo.todo}}
          }
        </ol>
    }
    </div>
  </div>
